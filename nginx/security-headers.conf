# 보안 헤더. nginx 의 add_header 는 자기 add_header 가 있는 location 에 상속되지 않으므로 각 location 에서 include 한다.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS: 1년, 서브도메인 포함. HTTPS 종단이 상위 프록시(CDN/LB)에 있어도 헤더는 그대로 전달됨.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP: API 도메인 connect-src 명시. 'unsafe-inline'은 React 인라인 스타일/Vite HMR 호환을 위해 유지.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tolelom.xyz https://api.tolelom.xyz" always;
