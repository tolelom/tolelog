server {
  listen 80;

  # ── gzip 압축 ──
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;

  # ── SSG + SPA 라우팅 ──
  # vite-react-ssg 가 정적 HTML 파일을 라우트별로 생성한다.
  # 출력 형태가 평탄(/login.html) 또는 중첩(/post/123/index.html) 일 수 있으므로 둘 다 시도하고,
  # 매칭되는 정적 HTML 이 없으면 최종적으로 /index.html (SPA) 로 폴백한다.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/index.html $uri/ /index.html;

    # HTML/SPA 응답은 캐시 금지 (배포 후 즉시 최신 버전 제공).
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ── Vite 해시 포함 정적 자원 (JS, CSS) — 장기 캐싱 ──
  location ~* \.(?:js|css)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
  }

  # ── 폰트 파일 — 장기 캐싱 ──
  location ~* \.(?:woff2?|ttf|eot|otf)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
  }

  # ── 이미지 — 장기 캐싱 ──
  location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
    root /usr/share/nginx/html;
    expires 6M;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
  }
}
