server {
  listen 80;

  # ── gzip 압축 ──
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;

  # ── 보안 헤더 ──
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HSTS: 1년, 서브도메인 포함. HTTPS 종단이 상위 프록시(CDN/LB)에 있어도 헤더는 그대로 전달됨.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # CSP: API 도메인 connect-src 명시. 'unsafe-inline'은 React 인라인 스타일/Vite HMR 호환을 위해 유지 (Sprint 2에서 nonce 도입 검토).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tolelom.xyz https://api.tolelom.xyz" always;

  # ── SSG + SPA 라우팅 ──
  # vite-react-ssg 가 정적 HTML 파일을 라우트별로 생성한다.
  # 출력 형태가 평탄(/login.html) 또는 중첩(/post/123/index.html) 일 수 있으므로 둘 다 시도하고,
  # 매칭되는 정적 HTML 이 없으면 최종적으로 /index.html (SPA) 로 폴백한다.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/index.html $uri/ /index.html;

    # HTML/SPA 응답은 캐시 금지 (배포 후 즉시 최신 버전 제공).
    # nginx 의 add_header 는 부모 블록에서 상속되지 않으므로 보안 헤더를 여기서 다시 선언한다.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tolelom.xyz https://api.tolelom.xyz" always;
  }

  # ── Vite 해시 포함 정적 자원 (JS, CSS) — 장기 캐싱 ──
  location ~* \.(?:js|css)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    access_log off;
  }

  # ── 폰트 파일 — 장기 캐싱 ──
  location ~* \.(?:woff2?|ttf|eot|otf)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log off;
  }

  # ── 이미지 — 장기 캐싱 ──
  location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
    root /usr/share/nginx/html;
    expires 6M;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }
}
